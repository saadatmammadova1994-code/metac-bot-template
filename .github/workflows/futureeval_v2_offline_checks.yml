name: FutureEval V2 offline checks

# No network/model tokens necessary. Runs *only* on this experimental branch.
on:
  push:
    branches:
      - feature/futureeval-v2-guard-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source (does not import external dependencies)
        run: python -m compileall -q main.py guard_logic.py forecast_core.py chronological_backtest.py scripts/free_single_question_test.py
      - name: Run offline unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
