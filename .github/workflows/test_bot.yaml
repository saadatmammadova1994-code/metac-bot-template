name: Test Bot

# Safe, manually invoked single-question test. NO schedules.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metaculus-manual-test
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Validate secret names and limits
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$METACULUS_TOKEN" || (echo "Missing METACULUS_TOKEN" && exit 1)
          test -n "$OPENROUTER_API_KEY" || (echo "Missing OPENROUTER_API_KEY" && exit 1)
          grep -Fq 'FREE_MODEL = "openrouter/nvidia/nemotron-3.5-super-vl:free"' scripts/free_single_question_test.py
          echo "Manual-only, single-question, free-endpoint smoke test"
      - name: Run one test-area binary forecast only
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run python scripts/free_single_question_test.py
